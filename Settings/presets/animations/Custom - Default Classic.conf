# Custom Hyprland Animation Preset
# Profile Name: Default Classic
# Generated via Quickshell Settings

animations {
  enabled = yes

  bezier = wind, 0.05, 0.9, 0.1, 1.05
  bezier = winIn, 0.1, 1.1, 0.1, 1.1
  bezier = winOut, 0.3, -0.3, 0, 1
  bezier = liner, 1, 1, 1, 1
  bezier = overshot, 0.05, 0.9, 0.1, 1.05
  bezier = smoothOut, 0.5, 0, 0.99, 0.99
  bezier = smoothIn, 0.5, -0.5, 0.68, 1.5
  bezier = linear, 0.0, 0.0, 1.0, 1.0

  animation = windowsIn, 1, 5.0, winIn, slide
  animation = windowsOut, 1, 3.0, smoothOut, slide
  animation = windowsMove, 1, 5.0, wind, slide
  animation = layersIn, 1, 4.0, winIn, popin
  animation = layersOut, 1, 3.0, winOut, fade
  animation = workspaces, 1, 5.0, overshot
  animation = specialWorkspace, 1, 4.0, wind, slidefadevert 15%
  animation = fade, 1, 3.0, smoothOut
  animation = border, 1, 1.0, liner
  animation = borderangle, 1, 180.0, liner, loop
  animation = windows, 1, 6.0, wind, slide
  animation = workspacesIn, 1, 5.0, winIn, slide
  animation = workspacesOut, 1, 5.0, winOut, slide
}
